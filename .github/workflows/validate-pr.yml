name: Validate intern PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BRANCH: ${{ github.head_ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Branch name is <module>/<username>/day_<n>
        run: |
          [[ "$BRANCH" =~ ^[A-Za-z0-9_]+/${AUTHOR}/day_[0-9]+$ ]] || { echo "Bad branch name: $BRANCH"; exit 1; }
      - name: Only touches own contributors folder
        run: |
          gh pr diff $PR --name-only --repo ${{ github.repository }} > files.txt
          while read -r f; do
            [[ "$f" == contributors/$AUTHOR/* ]] || { echo "Not allowed to change: $f"; exit 1; }
          done < files.txt
      - name: exercise.md is included
        run: |
          gh pr diff $PR --name-only --repo ${{ github.repository }} > files.txt
          grep -q 'exercise.md$' files.txt || { echo "exercise.md missing"; exit 1; }
      - name: Max 2 PRs per day
        run: |
          today=$(date -u +%F)
          n=$(gh pr list --repo ${{ github.repository }} --author "$AUTHOR" --state all \
              --search "created:>=$today" --json number --jq length)
          echo "PRs today: $n"
          [ "$n" -le 2 ] || { echo "Daily PR limit exceeded"; exit 1; }
